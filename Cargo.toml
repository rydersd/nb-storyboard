[workspace]
members = ["crates/storyboard-core", "crates/storyboard-store", "crates/storyboard-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/rydersd/nb-storyboard"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "arbitrary_precision"] }
schemars = "1.2.3"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"
notify = "8.2.1"
rmcp = { version = "3.9.0", features = ["transport-io"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tiny-skia = "0.12.0"
resvg = "0.49.0"
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
svgtypes = "0.16.2"
proptest = "1.12.0"
uuid = { version = "1.21.0", features = ["v4"] }

# Rendering tests draw real 8192 px frames; an unoptimised rasteriser makes them slow.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3
