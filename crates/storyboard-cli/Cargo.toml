[package]
name = "storyboard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "storyboard"
path = "src/main.rs"

[features]
default = ["render"]
render = ["storyboard-store/render", "storyboard-core/render"]

[dependencies]
base64 = "0.23.0"
clap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
storyboard-core = { path = "../storyboard-core", features = ["schema"] }
storyboard-store = { path = "../storyboard-store" }
time.workspace = true

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.3"
serde_json.workspace = true
tempfile = "3.26.0"
image.workspace = true
