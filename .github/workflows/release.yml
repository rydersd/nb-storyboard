name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  archive:
    name: Archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Intel target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p storyboard-cli
      - name: Smoke Apple Silicon binary
        if: matrix.target == 'aarch64-apple-darwin'
        run: target/aarch64-apple-darwin/release/storyboard --version
      - name: Inspect Intel binary architecture
        if: matrix.target == 'x86_64-apple-darwin'
        run: lipo -archs target/x86_64-apple-darwin/release/storyboard | grep -wx x86_64
      - name: Package archive
        shell: bash
        run: |
          package="storyboard-${{ matrix.target }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/storyboard" "$package/storyboard"
          cp LICENSE-APACHE LICENSE-MIT README.md "$package"
          tar -czf "$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: storyboard-${{ matrix.target }}
          path: storyboard-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 storyboard-*.tar.gz > SHA256SUMS
      - name: Upload release archives
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Unsigned and not notarized. macOS Gatekeeper will block it on first run; see README for the one-line fix.
          generate_release_notes: true
          files: |
            dist/storyboard-*.tar.gz
            dist/SHA256SUMS
